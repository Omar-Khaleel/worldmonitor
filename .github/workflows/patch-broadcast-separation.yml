name: Apply Broadcast Separation Patch

on:
  push:
    branches:
      - broadcast-station-mvp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: broadcast-station-mvp
          fetch-depth: 0

      - name: Patch routes, build entries and viewer races
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replace(path, from, to) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(from)) throw new Error(`${path}: replacement anchor not found: ${from.slice(0, 100)}`);
            text = text.replace(from, to);
            fs.writeFileSync(path, text);
          }

          replace(
            'vite.config.ts',
            "import pkg from './package.json';",
            "import pkg from './package.json';\nimport { broadcastStationDevPlugin } from './scripts/vite/broadcast-station-plugin';",
          );
          replace(
            'vite.config.ts',
            "      htmlVariantPlugin(activeMeta, activeVariant, isDesktopBuild),",
            "      broadcastStationDevPlugin(),\n      htmlVariantPlugin(activeMeta, activeVariant, isDesktopBuild),",
          );
          replace(
            'vite.config.ts',
            "          main: resolve(__dirname, 'index.html'),\n          embed: resolve(__dirname, 'embed.html'),",
            "          main: resolve(__dirname, 'index.html'),\n          control: resolve(__dirname, 'control/index.html'),\n          broadcast: resolve(__dirname, 'broadcast/index.html'),\n          embed: resolve(__dirname, 'embed.html'),",
          );
          replace(
            'vite.config.ts',
            "              urlPattern: ({ request }: { request: Request }) => request.mode === 'navigate',",
            "              urlPattern: ({ request, url }: { request: Request; url: URL }) =>\n                request.mode === 'navigate'\n                && !/^\\/(?:broadcast|control)(?:\\/|$)/.test(url.pathname),",
          );

          const vercelPath = 'vercel.json';
          const vercel = JSON.parse(fs.readFileSync(vercelPath, 'utf8'));
          const dedicatedSources = new Set(['/control', '/control/', '/broadcast', '/broadcast/']);
          vercel.rewrites = vercel.rewrites.filter((entry) => !dedicatedSources.has(entry.source));
          const embedIndex = Math.max(0, vercel.rewrites.findIndex((entry) => entry.source === '/embed'));
          vercel.rewrites.splice(embedIndex, 0,
            { source: '/control', destination: '/control/index.html' },
            { source: '/control/', destination: '/control/index.html' },
            { source: '/broadcast', destination: '/broadcast/index.html' },
            { source: '/broadcast/', destination: '/broadcast/index.html' },
          );
          const catchAll = vercel.rewrites.find((entry) => typeof entry.source === 'string' && entry.destination === '/dashboard.html' && entry.source.includes('(?!api|'));
          if (!catchAll) throw new Error('vercel catch-all rewrite not found');
          if (!catchAll.source.includes('broadcast|control|')) {
            catchAll.source = catchAll.source.replace('(?!api|', '(?!broadcast|control|api|');
          }
          vercel.headers = vercel.headers.filter((entry) => entry.source !== '/broadcast/(.*)' && entry.source !== '/control/(.*)');
          vercel.headers.unshift(
            {
              source: '/broadcast/(.*)',
              headers: [
                { key: 'Cache-Control', value: 'no-store, no-cache, must-revalidate' },
                { key: 'X-Robots-Tag', value: 'noindex, nofollow' },
              ],
            },
            {
              source: '/control/(.*)',
              headers: [
                { key: 'Cache-Control', value: 'no-store, no-cache, must-revalidate' },
                { key: 'X-Robots-Tag', value: 'noindex, nofollow' },
              ],
            },
          );
          fs.writeFileSync(vercelPath, `${JSON.stringify(vercel, null, 2)}\n`);

          replace(
            'src/services/meta-tags.ts',
            "  url.pathname = '/';\n  url.searchParams.set(mode, '1');",
            "  url.pathname = mode === 'control' ? '/control/' : '/broadcast/';\n  url.searchParams.set(mode, '1');",
          );
          replace(
            'src/broadcast-station.ts',
            "function isViewerMode(params = new URL(window.location.href).searchParams): boolean {\n  return params.get('broadcast') === '1';\n}\n\nfunction isControlMode(params = new URL(window.location.href).searchParams): boolean {\n  return params.get('control') === '1';\n}",
            "function normalizedPath(): string {\n  return window.location.pathname.replace(/\\/+$/, '') || '/';\n}\n\nfunction isViewerMode(params = new URL(window.location.href).searchParams): boolean {\n  return normalizedPath() === '/broadcast' || params.get('broadcast') === '1';\n}\n\nfunction isControlMode(params = new URL(window.location.href).searchParams): boolean {\n  const path = normalizedPath();\n  return path === '/control' || path === '/station' || params.get('control') === '1';\n}",
          );
          replace(
            'src/broadcast-station.ts',
            "  url.search = '';\n  url.searchParams.set('broadcast', '1');",
            "  url.pathname = '/broadcast/';\n  url.search = '';\n  url.searchParams.set('broadcast', '1');",
          );
          replace(
            'src/broadcast-launcher.ts',
            "  url.pathname = '/control';",
            "  url.pathname = '/control/';",
          );
          replace(
            'src/styles/broadcast-viewer-lite.css',
            "  .ayn-panel-grid { grid-template-columns: repeat(min(2, var(--ayn-columns)), minmax(0, 1fr)); }\n  .ayn-media-wall { grid-template-columns: repeat(min(2, var(--ayn-media-columns)), minmax(0, 1fr)); }",
            "  .ayn-panel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .ayn-media-wall { grid-template-columns: repeat(2, minmax(0, 1fr)); }",
          );

          replace(
            'src/broadcast-viewer-entry.ts',
            "let mediaKey = '';\nlet mapKey = '';",
            "let mediaKey = '';\nlet mediaGeneration = 0;\nlet mapKey = '';",
          );
          replace(
            'src/broadcast-viewer-entry.ts',
            "async function renderMedia(config: LiveBroadcastConfig): Promise<void> {\n  const sources = config.showMediaWall ? config.mediaSources.slice(0, 12) : [];\n  const nextKey = JSON.stringify(sources);\n  ui.mediaSection.hidden = sources.length === 0;\n  document.documentElement.style.setProperty('--ayn-media-columns', String(config.mediaColumns));\n  if (nextKey === mediaKey) return;\n  mediaKey = nextKey;\n  destroyMedia();\n  const tiles = await Promise.all(sources.map(createMediaTile));\n  ui.mediaWall.append(...tiles.filter((tile): tile is HTMLElement => Boolean(tile)));\n}",
            "async function renderMedia(config: LiveBroadcastConfig): Promise<void> {\n  const sources = config.showMediaWall ? config.mediaSources.slice(0, 12) : [];\n  const nextKey = JSON.stringify(sources);\n  ui.mediaSection.hidden = sources.length === 0;\n  document.documentElement.style.setProperty('--ayn-media-columns', String(config.mediaColumns));\n  if (nextKey === mediaKey) return;\n  mediaKey = nextKey;\n  const generation = ++mediaGeneration;\n  destroyMedia();\n  const tiles = await Promise.all(sources.map(createMediaTile));\n  if (generation !== mediaGeneration) {\n    tiles.forEach((tile) => tile?.querySelectorAll<ManagedVideoElement>('video').forEach((video) => {\n      video.__aynHls?.destroy();\n      video.pause();\n    }));\n    return;\n  }\n  ui.mediaWall.append(...tiles.filter((tile): tile is HTMLElement => Boolean(tile)));\n}",
          );
          NODE

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vite.config.ts vercel.json src/services/meta-tags.ts src/broadcast-station.ts src/broadcast-launcher.ts src/styles/broadcast-viewer-lite.css src/broadcast-viewer-entry.ts
          git commit -m 'separate control and lightweight viewer routes'
          git push origin HEAD:broadcast-station-mvp
