name: Diagnose Broadcast Doc Claims

on:
  push:
    branches:
      - broadcast-station-mvp

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: broadcast-station-mvp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture claim mismatches
        shell: bash
        run: |
          mkdir -p diagnostics/broadcast-general
          node scripts/docs-stats.mjs --check > diagnostics/broadcast-general/doc-claims.txt 2>&1 || true
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/broadcast-general/doc-claims.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'capture stale documentation claims'
          git push origin HEAD:broadcast-station-mvp
