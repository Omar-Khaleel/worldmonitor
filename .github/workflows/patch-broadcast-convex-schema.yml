name: Register Broadcast State Table

on:
  push:
    branches:
      - broadcast-station-mvp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: broadcast-station-mvp
          fetch-depth: 0

      - name: Add broadcast state table
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'convex/schema.ts';
          let text = fs.readFileSync(path, 'utf8');
          if (text.includes('broadcastStates: defineTable')) process.exit(0);
          const marker = '  userPreferenceWriteRateLimits: defineTable({';
          if (!text.includes(marker)) throw new Error('schema insertion marker not found');
          const table = `  broadcastStates: defineTable({
            station: v.string(),
            config: v.any(),
            version: v.number(),
            controlKeyHash: v.string(),
            updatedAt: v.number(),
          }).index("by_station", ["station"]),

`;
          text = text.replace(marker, table + marker);
          fs.writeFileSync(path, text);
          NODE

      - name: Commit schema
        shell: bash
        run: |
          if git diff --quiet -- convex/schema.ts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add convex/schema.ts
          git commit -m 'add persistent broadcast station state table'
          git push origin HEAD:broadcast-station-mvp
