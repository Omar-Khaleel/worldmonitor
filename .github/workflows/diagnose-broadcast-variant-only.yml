name: Diagnose Broadcast Variant Only

on:
  push:
    branches:
      - broadcast-station-mvp

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: broadcast-station-mvp
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --silent
      - run: npx playwright install --with-deps chromium >/tmp/broadcast-variant-browser.log 2>&1
      - name: Capture variant-smoke failure
        shell: bash
        run: |
          npm run test:e2e:variant-smoke:full >/tmp/broadcast-variant.log 2>&1 || true
          mkdir -p diagnostics/broadcast-general
          {
            grep -nE 'Error:|failed|failure|expect\(|Timeout|unexpectedPageErrors|missingExpected|expectedPanelFailures' /tmp/broadcast-variant.log | tail -n 240 || true
            echo
            tail -n 420 /tmp/broadcast-variant.log || true
          } > diagnostics/broadcast-general/variant-smoke.txt
          rm .github/workflows/diagnose-broadcast-variant-only.yml
      - name: Commit diagnostic and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/broadcast-general/variant-smoke.txt .github/workflows/diagnose-broadcast-variant-only.yml
          git commit -m 'capture variant smoke failure diagnostics'
          git pull --rebase origin broadcast-station-mvp
          git push origin HEAD:broadcast-station-mvp
