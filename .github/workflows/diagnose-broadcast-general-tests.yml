name: Diagnose Broadcast General Tests

on:
  push:
    branches:
      - broadcast-station-mvp

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: broadcast-station-mvp
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --silent

      - name: Build dashboard
        id: build
        continue-on-error: true
        run: VITE_VARIANT=full npx vite build > general-build.log 2>&1

      - name: Run complete data test suite
        id: data_tests
        continue-on-error: true
        run: npm run test:data > general-data-tests.log 2>&1

      - name: Install Chromium
        id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium > general-browser-install.log 2>&1

      - name: Run full variant smoke
        id: variant
        continue-on-error: true
        run: npm run test:e2e:variant-smoke:full > general-variant-smoke.log 2>&1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-general-test-diagnostics
          path: |
            general-build.log
            general-data-tests.log
            general-browser-install.log
            general-variant-smoke.log
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 3

      - name: Report outcomes
        if: always()
        run: |
          echo "build=${{ steps.build.outcome }}"
          echo "data_tests=${{ steps.data_tests.outcome }}"
          echo "browser=${{ steps.browser.outcome }}"
          echo "variant=${{ steps.variant.outcome }}"
