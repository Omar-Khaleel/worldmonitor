name: Diagnose Broadcast General Tests

on:
  push:
    branches:
      - broadcast-station-mvp

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: broadcast-station-mvp
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --silent

      - name: Build dashboard
        id: build
        continue-on-error: true
        run: VITE_VARIANT=full npx vite build > general-build.log 2>&1

      - name: Run complete data test suite
        id: data_tests
        continue-on-error: true
        run: npm run test:data > general-data-tests.log 2>&1

      - name: Install Chromium
        id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium > general-browser-install.log 2>&1

      - name: Run full variant smoke
        id: variant
        continue-on-error: true
        run: npm run test:e2e:variant-smoke:full > general-variant-smoke.log 2>&1

      - name: Save concise diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics/broadcast-general
          {
            echo '# Build tail'
            tail -n 120 general-build.log || true
          } > diagnostics/broadcast-general/build.txt
          {
            echo '# Data-test failures and tail'
            grep -nE '^(not ok|# fail|FAIL|Error:|AssertionError|✖|×)|failed|failure' general-data-tests.log | tail -n 160 || true
            echo
            tail -n 260 general-data-tests.log || true
          } > diagnostics/broadcast-general/data-tests.txt
          {
            echo '# Variant-smoke failures and tail'
            grep -nE 'Error:|failed|failure|expect\(|Timeout|pageerror|console' general-variant-smoke.log | tail -n 160 || true
            echo
            tail -n 260 general-variant-smoke.log || true
          } > diagnostics/broadcast-general/variant-smoke.txt

      - name: Commit concise diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/broadcast-general
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'capture broadcast branch general test diagnostics'
          git push origin HEAD:broadcast-station-mvp

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-general-test-diagnostics
          path: |
            general-build.log
            general-data-tests.log
            general-browser-install.log
            general-variant-smoke.log
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 3

      - name: Report outcomes
        if: always()
        run: |
          echo "build=${{ steps.build.outcome }}"
          echo "data_tests=${{ steps.data_tests.outcome }}"
          echo "browser=${{ steps.browser.outcome }}"
          echo "variant=${{ steps.variant.outcome }}"
