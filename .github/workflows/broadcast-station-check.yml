name: Broadcast Station Check

on:
  push:
    branches:
      - broadcast-station-mvp
  pull_request:
    branches:
      - custom-demo-branding
    paths:
      - 'src/broadcast-*.ts'
      - 'src/styles/broadcast-*.css'
      - 'api/broadcast/**'
      - 'docs/broadcast-station.md'
      - '.github/workflows/broadcast-station-check.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck dashboard
        run: npm run typecheck

      - name: Typecheck API
        run: npx tsc --noEmit -p tsconfig.api.json
