name: Broadcast Station Check

on:
  push:
    branches:
      - broadcast-station-mvp
  pull_request:
    branches:
      - custom-demo-branding
    paths:
      - 'src/broadcast-*.ts'
      - 'src/styles/broadcast-*.css'
      - 'api/broadcast/**'
      - 'docs/broadcast-station.md'
      - '.github/workflows/broadcast-station-check.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install dependencies quietly
        shell: bash
        run: npm ci --ignore-scripts --silent >/dev/null 2>&1

      - name: Typecheck dashboard
        run: npx tsc --noEmit --pretty false

      - name: Typecheck API
        run: npx tsc --noEmit --pretty false -p tsconfig.api.json
