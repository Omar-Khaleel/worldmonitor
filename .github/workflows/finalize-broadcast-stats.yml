name: Finalize Broadcast Stats

on:
  push:
    branches:
      - broadcast-station-mvp

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: broadcast-station-mvp
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Remove helper and regenerate tracked statistics
        shell: bash
        run: |
          rm .github/workflows/finalize-broadcast-stats.yml
          node scripts/docs-stats.mjs
      - name: Commit finalized statistics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-broadcast-stats.yml docs/generated/stats.json
          git commit -m 'finalize broadcast station workflow statistics'
          git pull --rebase origin broadcast-station-mvp
          git push origin HEAD:broadcast-station-mvp
