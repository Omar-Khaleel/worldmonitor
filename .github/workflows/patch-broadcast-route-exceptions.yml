name: Register Broadcast API Helpers

on:
  push:
    branches:
      - broadcast-station-mvp

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: broadcast-station-mvp
          fetch-depth: 0

      - name: Register internal broadcast helpers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'api/api-route-exceptions.json';
          let text = fs.readFileSync(path, 'utf8');
          const parsed = JSON.parse(text);
          const existing = new Set(parsed.exceptions.map((entry) => entry.path));
          const entries = [];
          if (!existing.has('api/broadcast/state.ts')) {
            entries.push(`    {
              "path": "api/broadcast/state.ts",
              "category": "internal-helper",
              "reason": "Dashboard-internal transport for the Ain Al-Saqr broadcast control room. Stores and returns station-scoped presentation state so a viewer link can receive panel, map-layer, channel, webcam, ticker, and translation changes without reloading. It is control-plane plumbing rather than a product data API; writes require a station controller key and enforce station, payload-size, retention, and record-count limits.",
              "owner": "@Omar-Khaleel",
              "removal_issue": null
            },`);
          }
          if (!existing.has('api/broadcast/translate.ts')) {
            entries.push(`    {
              "path": "api/broadcast/translate.ts",
              "category": "internal-helper",
              "reason": "Dashboard-internal Arabic translation proxy for the Ain Al-Saqr ticker and visible news cards. Keeps provider credentials server-side and exposes only a tightly bounded batch translation shape used by the broadcast UI; it is presentation plumbing, not a public product data contract.",
              "owner": "@Omar-Khaleel",
              "removal_issue": null
            },`);
          }
          if (entries.length === 0) process.exit(0);
          const marker = '    {\n      "path": "api/latest-brief.ts"';
          if (!text.includes(marker)) throw new Error('deferred-section marker not found');
          text = text.replace(marker, `${entries.join('\n')}\n\n${marker}`);
          JSON.parse(text);
          fs.writeFileSync(path, text);
          NODE

      - name: Commit registration
        shell: bash
        run: |
          if git diff --quiet -- api/api-route-exceptions.json; then
            echo 'Broadcast API helpers are already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/api-route-exceptions.json
          git commit -m 'register broadcast internal API helpers'
          git push origin HEAD:broadcast-station-mvp
