name: Patch Broadcast Architecture Docs

on:
  push:
    branches:
      - broadcast-station-mvp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: broadcast-station-mvp
          fetch-depth: 0
      - name: Register permanent validation workflow and remove this helper
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'ARCHITECTURE.md';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('`broadcast-station-check.yml`')) {
            const anchor = '| `test.yml` | PR, push to main | Unit/integration suite, docs-stats guardrail, plus conditional digest-image and resilience-validation smoke gates |';
            const row = '| `broadcast-station-check.yml` | PR and broadcast branch changes | Isolated control/viewer routing, live state API, lightweight bundle size, refresh behavior, and no-reload Playwright update test |';
            if (!text.includes(anchor)) throw new Error('CI table anchor not found');
            text = text.replace(anchor, `${anchor}\n${row}`);
            fs.writeFileSync(path, text);
          }
          fs.rmSync('.github/workflows/patch-broadcast-architecture.yml');
          NODE
      - name: Commit documentation patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md .github/workflows/patch-broadcast-architecture.yml
          git commit -m 'document broadcast station validation workflow'
          git pull --rebase origin broadcast-station-mvp
          git push origin HEAD:broadcast-station-mvp
